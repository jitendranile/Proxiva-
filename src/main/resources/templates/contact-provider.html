<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contact Provider - Proxiva</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#050505,#111827,#1f2937);
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
        }

        .contact-box{
            width:460px;
            padding:40px;
            border-radius:30px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,0.15);
            box-shadow:0 20px 50px rgba(0,0,0,0.4);
            text-align:center;
        }

        h1{
            margin-bottom:10px;
        }

        .booking{
            color:#cbd5e1;
            margin-bottom:25px;
        }

        .provider-icon{
            font-size:70px;
            margin-bottom:20px;
        }

        .info{
            background:rgba(255,255,255,0.10);
            padding:16px;
            border-radius:18px;
            margin-bottom:15px;
            text-align:left;
        }

        .actions{
            display:flex;
            gap:12px;
            margin-top:25px;
        }

        .btn{
            flex:1;
            padding:14px;
            border:none;
            border-radius:16px;
            text-decoration:none;
            color:white;
            font-weight:700;
            background:linear-gradient(135deg,#7c3aed,#2563eb);
        }

        .back{
            display:block;
            margin-top:20px;
            color:#93c5fd;
            text-decoration:none;
            font-weight:700;
        }
    </style>
</head>

<body>

<div class="contact-box">

    <div class="provider-icon">👷</div>

    <h1>Contact Provider</h1>

    <p class="booking" th:text="'Booking ID: #' + ${bookingId}">
        Booking ID
    </p>

    <div class="info">
        <strong>Provider Name:</strong> Proxiva Service Partner
    </div>

    <div class="info">
        <strong>Phone:</strong> +91 9876543210
    </div>

    <div class="info">
        <strong>Email:</strong> provider@proxiva.com
    </div>

    <div class="actions">
        <a class="btn" href="tel:+919876543210">📞 Call</a>
        <a class="btn" href="mailto:provider@proxiva.com">✉️ Email</a>
    </div>

    <a class="back" href="/bookings">← Back to My Bookings</a>

</div>

</body>
</html>
