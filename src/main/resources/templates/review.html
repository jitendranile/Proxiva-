<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Review & Rating - Proxiva</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

min-height:100vh;

background:linear-gradient(
135deg,
#050505,
#111827,
#1f2937
);

display:flex;
justify-content:center;
align-items:center;

color:white;

padding:30px;

}

.review-container{

width:550px;

background:rgba(
255,
255,
255,
0.08
);

backdrop-filter:blur(15px);

padding:40px;

border-radius:30px;

border:1px solid rgba(
255,
255,
255,
0.1
);

box-shadow:
0 15px 35px rgba(
0,
0,
0,
0.4
);

}

.logo{

font-size:35px;

font-weight:bold;

margin-bottom:10px;

text-align:center;

}

.subtitle{

text-align:center;

color:#cbd5e1;

margin-bottom:30px;

}

.booking{

text-align:center;

margin-bottom:20px;

color:#94a3b8;

}

.rating-box{

text-align:center;

margin-bottom:25px;

}

.star{

font-size:40px;

cursor:pointer;

transition:.3s;

}

.star:hover{

transform:scale(1.2);

}

textarea{

width:100%;

height:130px;

padding:15px;

border:none;

outline:none;

border-radius:20px;

margin-top:20px;

background:rgba(
255,
255,
255,
0.1
);

color:white;

resize:none;

}

textarea::placeholder{

color:#cbd5e1;

}

button{

width:100%;

padding:15px;

margin-top:25px;

border:none;

border-radius:20px;

font-size:16px;

font-weight:bold;

cursor:pointer;

background:linear-gradient(
135deg,
#7c3aed,
#2563eb
);

color:white;

transition:.3s;

}

button:hover{

transform:translateY(-4px);

}

.back{

display:block;

text-align:center;

margin-top:25px;

text-decoration:none;

color:#60a5fa;

font-weight:bold;

}

</style>

</head>

<body>

<div class="review-container">

<div class="logo">

PROXIVA

</div>

<div class="subtitle">

Rate Your Service Experience

</div>

<div class="booking">

Booking ID :
<span th:text="${bookingId}"></span>

</div>

<div class="rating-box">

<span class="star">⭐</span>
<span class="star">⭐</span>
<span class="star">⭐</span>
<span class="star">⭐</span>
<span class="star">⭐</span>

</div>

<textarea
placeholder=
"Share your experience with service provider...">
</textarea>

<button onclick=
"alert('Review Submitted Successfully ✅')">

Submit Review

</button>

<a href="/bookings"
class="back">

← Back to My Bookings

</a>

</div>

<script>

const stars=
document.querySelectorAll(".star");

stars.forEach((star,index)=>{

star.addEventListener(
"click",

()=>{

stars.forEach((s,i)=>{

if(i<=index){

s.style.color=
"#FFD700";

}
else{

s.style.color=
"white";

}

});

});

});

</script>

</body>
</html>
