<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>My Bookings - Proxiva</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
    min-height:100vh;
    padding:40px;
    color:white;
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.logo{
    font-size:40px;
    font-weight:bold;
    letter-spacing:2px;
}

.subtitle{
    color:#bdbdbd;
}

.back-btn{
    text-decoration:none;
    color:white;
    padding:12px 20px;
    border-radius:15px;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
}

.booking-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:30px;
}

.booking-card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:30px;
    padding:30px;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 10px 35px rgba(0,0,0,0.3);
    transition:.5s;
}

.booking-card:hover{
    transform:translateY(-10px);
}

.card-title{
    font-size:25px;
    margin-bottom:20px;
}

.info{
    margin-bottom:15px;
    color:#ddd;
}

.status{
    display:inline-block;
    padding:10px 18px;
    border-radius:20px;
    font-weight:bold;
    margin-top:10px;
}

.pending{
    background:#f59e0b;
}

.accepted{
    background:#16a34a;
}

.rejected{
    background:#dc2626;
}

.completed{
    background:#2563eb;
}

.actions{
    margin-top:25px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    padding:12px 18px;
    border-radius:15px;
    font-size:14px;
    font-weight:bold;
    color:white;
    transition:.3s;
}

.contact{
    background:#9333ea;
}

.pay{
    background:#2563eb;
}

.review{
    background:#16a34a;
}

.btn:hover{
    transform:scale(1.05);
}

.empty{
    background:rgba(255,255,255,0.08);
    padding:40px;
    border-radius:25px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <div class="logo">PROXIVA</div>
            <div class="subtitle">Track your bookings and service status</div>
        </div>

        <a href="/dashboard" class="back-btn">← Dashboard</a>
    </div>

    <div class="empty" th:if="${bookings == null or bookings.size() == 0}">
        <h2>No Bookings Found</h2>
        <p>You have not booked any service yet.</p>
        <br>
        <a href="/dashboard" class="back-btn">Book Service</a>
    </div>

    <div class="booking-container">

        <div class="booking-card" th:each="booking : ${bookings}">

            <h2 class="card-title">
                Booking #<span th:text="${booking.id}"></span>
            </h2>

            <div class="info">
                <strong>Service ID:</strong>
                <span th:text="${booking.serviceId}"></span>
            </div>

            <div class="info">
                <strong>Status:</strong>

                <span class="status pending"
                      th:if="${booking.status == 'Pending'}"
                      th:text="${booking.status}">
                </span>

                <span class="status accepted"
                      th:if="${booking.status == 'Accepted'}"
                      th:text="${booking.status}">
                </span>

                <span class="status rejected"
                      th:if="${booking.status == 'Rejected'}"
                      th:text="${booking.status}">
                </span>

                <span class="status completed"
                      th:if="${booking.status == 'Completed'}"
                      th:text="${booking.status}">
                </span>
            </div>

            <div class="actions">
                <a th:href="@{'/contact-provider/' + ${booking.id}}"
                   class="btn contact">
                    Contact Provider
                </a>

                <a th:href="@{'/payment/' + ${booking.id}}"
                   class="btn pay">
                    Pay Now
                </a>

                <a th:href="@{'/review/' + ${booking.id}}"
                   class="btn review">
                    Rate Service
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
