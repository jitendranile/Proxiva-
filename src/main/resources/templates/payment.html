<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment - Proxiva</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#050505,#111827,#1f2937);
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
        }

        .payment-box{
            width:460px;
            padding:40px;
            border-radius:30px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,0.15);
            box-shadow:0 20px 50px rgba(0,0,0,0.4);
            text-align:center;
        }

        .icon{
            font-size:70px;
            margin-bottom:20px;
        }

        h1{
            margin-bottom:10px;
        }

        .booking{
            color:#cbd5e1;
            margin-bottom:25px;
        }

        .amount{
            background:rgba(255,255,255,0.12);
            padding:20px;
            border-radius:20px;
            margin-bottom:20px;
            font-size:24px;
            font-weight:800;
        }

        select{
            width:100%;
            padding:15px;
            border:none;
            outline:none;
            border-radius:16px;
            margin-bottom:20px;
            background:rgba(255,255,255,0.12);
            color:white;
        }

        option{
            color:#111;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:18px;
            background:linear-gradient(135deg,#7c3aed,#2563eb);
            color:white;
            font-weight:800;
            cursor:pointer;
        }

        .back{
            display:block;
            margin-top:20px;
            color:#93c5fd;
            text-decoration:none;
            font-weight:700;
        }
    </style>
</head>

<body>

<div class="payment-box">

    <div class="icon">💳</div>

    <h1>Payment</h1>

    <p class="booking" th:text="'Booking ID: #' + ${bookingId}">
        Booking ID
    </p>

    <div class="amount">
        Amount: ₹500
    </div>

    <select required>
        <option value="">Select Payment Method</option>
        <option>UPI</option>
        <option>Cash</option>
        <option>Card</option>
        <option>Net Banking</option>
    </select>

    <button onclick="alert('Payment Successful ✅')">
        Pay Now
    </button>

    <a class="back" href="/bookings">← Back to My Bookings</a>

</div>

</body>
</html>
